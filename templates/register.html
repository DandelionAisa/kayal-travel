
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — Каял</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <header class="catalog-header">
        <a href="/" class="logo">КАЯЛ</a>
        <a href="/tours">Наши путешествия</a>
    </header>

    <main class="auth-page">
        <div class="auth-card">
            <span class="section-subtitle">ПРИСОЕДИНЯЙТЕСЬ К НАМ</span>
            <h1>Создать аккаунт</h1>
            <p class="auth-subtitle">
                Начните своё путешествие по Карелии.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="auth-alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" class="auth-form">
                <input type="hidden" name="csrf_token"
                       value="{{ csrf_token() }}">

                <label for="name">Ваше имя</label>
                <input type="text" id="name" name="name"
                       maxlength="100" required
                       value="{{ request.form.get('name', '') }}"
                       placeholder="ФИО">

                <label for="email">Электронная почта</label>
                <input type="email" id="email" name="email"
                       maxlength="150" required
                       value="{{ request.form.get('email', '') }}"
                       placeholder="fio@mail.ru">

                <label for="password">Пароль</label>
                <input type="password" id="password" name="password"
                       minlength="8" maxlength="128" required
                       placeholder="Не менее 8 символов">

                <label for="confirm_password">Повторите пароль</label>
                <input type="password" id="confirm_password"
                       name="confirm_password" required>

                <button type="submit">Зарегистрироваться</button>
            </form>

            <p class="auth-switch">
                Уже есть аккаунт?
                <a href="{{ url_for('login') }}">Войти</a>
            </p>
        </div>
    </main>
</body>
</html>
